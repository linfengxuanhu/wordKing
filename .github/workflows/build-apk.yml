name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project files
        run: |
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml not found in repository root."; exit 1; }
          test -f lib/main.dart || { echo "ERROR: lib/main.dart not found in repository root."; exit 1; }
          echo "Project files found."

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android platform files are missing. Generating them in a temporary Flutter project."
            flutter create --platforms=android --org com.example --project-name word_king temp_project
            cp -r temp_project/android ./android
            rm -rf temp_project
          else
            echo "Android platform files already exist."
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordKing-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
